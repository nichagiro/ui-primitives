name: Security audit

on:
  schedule:
    - cron: "0 8 * * 1" # lunes 08:00 UTC
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch: # permite dispararlo manual desde la pestaña Actions

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
